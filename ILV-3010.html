<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow: hidden;
    font-family: "Georgia", serif;
    background: #050008;
    color: white;
}



.login-screen {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
        radial-gradient(circle at center, #3b071d 0%, #12000b 45%, #030003 100%);
    z-index: 10;
    transition: 1.5s ease;
}

.login-screen.hide {
    opacity: 0;
    pointer-events: none;
    transform: scale(1.2);
}

.login-box {
    width: min(90%, 400px);
    padding: 45px 35px;
    text-align: center;
    border-radius: 25px;

    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,150,180,0.25);
    backdrop-filter: blur(15px);

    box-shadow:
        0 0 40px rgba(255,20,100,0.15),
        inset 0 0 30px rgba(255,255,255,0.03);

    animation: appear 1.5s ease;
}

.login-box h1 {
    font-size: 35px;
    margin-bottom: 10px;
    color: #ff8fab;
    text-shadow: 0 0 20px #ff477e;
}

.login-box p {
    color: #d9aab9;
    margin-bottom: 30px;
    font-size: 14px;
}

.input-group {
    margin-bottom: 18px;
}

.input-group input {
    width: 100%;
    padding: 15px 18px;

    border: 1px solid rgba(255,120,160,0.3);
    border-radius: 12px;

    outline: none;
    background: rgba(0,0,0,0.35);
    color: white;

    font-size: 15px;
    transition: .3s;
}

.input-group input:focus {
    border-color: #ff6b96;
    box-shadow: 0 0 15px rgba(255,60,120,.25);
}

.continue-btn {
    width: 100%;
    padding: 15px;
    margin-top: 10px;

    border: none;
    border-radius: 12px;

    background: linear-gradient(135deg, #ff477e, #ff174f);
    color: white;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;
    transition: .3s;

    box-shadow: 0 0 20px rgba(255,30,90,.3);
}

.continue-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 0 35px rgba(255,30,90,.6);
}

.error {
    color: #ff6688;
    font-size: 13px;
    margin-top: 15px;
    min-height: 18px;
}



.love-screen {
    position: fixed;
    inset: 0;

    display: flex;
    justify-content: center;
    align-items: center;

    background:
        radial-gradient(circle at center,
        #4a061e 0%,
        #18000c 40%,
        #040004 100%);

    opacity: 0;
    pointer-events: none;
    transition: 1.5s ease;
}

.love-screen.show {
    opacity: 1;
    pointer-events: auto;
}


.heart-container {
    position: absolute;
    width: min(90vw, 900px);
    height: min(80vh, 700px);

    display: flex;
    justify-content: center;
    align-items: center;
}

.heart-text {
    position: absolute;

    color: #ff5c91;
    font-family: Arial, sans-serif;
    font-weight: bold;

    text-shadow:
        0 0 5px #ff174f,
        0 0 15px #ff174f,
        0 0 30px rgba(255,40,100,.8);

    white-space: nowrap;
    user-select: none;

    animation: heartGlow 2s infinite alternate;
}

@keyframes heartGlow {
    from {
        opacity: .55;
    }

    to {
        opacity: 1;
    }
}



.floating-heart {
    position: absolute;
    bottom: -30px;

    color: #ff477e;

    font-size: 18px;

    opacity: 0;

    animation: floatUp linear forwards;

    pointer-events: none;
}

@keyframes floatUp {
    0% {
        transform: translateY(0) scale(.5) rotate(0deg);
        opacity: 0;
    }

    15% {
        opacity: .8;
    }

    100% {
        transform:
            translateY(-110vh)
            scale(1.3)
            rotate(360deg);
        opacity: 0;
    }
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(30px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}



@media (max-width: 600px) {

    .login-box {
        padding: 35px 25px;
    }

    .login-box h1 {
        font-size: 28px;
    }

    .heart-text {
        font-size: 11px !important;
    }
}
</style>
</head>

<body>



<div class="login-screen" id="loginScreen">

    <div class="login-box">

        <h1>For Someone Special ❤️</h1>

        <p>
            Some little things are meant to be discovered.
        </p>

        <div class="input-group">
            <input
                type="text"
                id="username"
                placeholder="Username"
                autocomplete="off"
            >
        </div>

        <div class="input-group">
            <input
                type="password"
                id="password"
                placeholder="Password"
            >
        </div>

        <button class="continue-btn" onclick="login()">
            Continue ❤️
        </button>

        <div class="error" id="error"></div>

    </div>

</div>



<div class="love-screen" id="loveScreen">

    <div class="heart-container" id="heartContainer">

        <!-- Heart generated by JavaScript -->

    </div>

</div>


<script>


function login() {

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    const error =
        document.getElementById("error");

    if (
        username === "ILV-3010" &&
        password === "3010"
    ) {

        error.textContent = "";

        document
            .getElementById("loginScreen")
            .classList.add("hide");

        setTimeout(() => {

            document
                .getElementById("loveScreen")
                .classList.add("show");

            createHeart();
            startFloatingHearts();

        }, 800);

    } else {

        error.textContent =
            "Hmm... those details are not quite right ❤️";

    }
}


document
    .getElementById("password")
    .addEventListener("keydown", function(e) {

        if (e.key === "Enter") {
            login();
        }

    });


function createHeart() {

    const container =
        document.getElementById("heartContainer");


    const heartWidth =
        Math.min(window.innerWidth * 0.42, 400);

    const heartHeight =
        Math.min(window.innerHeight * 0.38, 280);

    const count = 650;

    for (let i = 0; i < count; i++) {

        const t =
            Math.random() * Math.PI * 2;

        const scale =
            Math.sqrt(Math.random());

        let x =
            16 * Math.pow(Math.sin(t), 3);

        let y =
            13 * Math.cos(t)
            - 5 * Math.cos(2 * t)
            - 2 * Math.cos(3 * t)
            - Math.cos(4 * t);

        x *= scale;
        y *= scale;

        const span =
            document.createElement("span");

        span.className = "heart-text";

        span.textContent = "I Love You";

        const fontSize =
            window.innerWidth < 600 ? 8 : 10;

        span.style.fontSize =
            fontSize + (Math.random() * 3) + "px";

        span.style.left =
            `calc(50% + ${(x / 16) * heartWidth / 2}px)`;

        span.style.top =
            `calc(50% - ${(y / 17) * heartHeight / 2}px)`;

        span.style.transform =
            "translate(-50%, -50%)";

        span.style.animationDelay =
            Math.random() * 2 + "s";

        container.appendChild(span);
    }
}



function createFloatingHeart() {

    const heart =
        document.createElement("div");

    heart.className = "floating-heart";

    heart.textContent =
        Math.random() > .5 ? "♥" : "♡";

    heart.style.left =
        Math.random() * 100 + "vw";

    heart.style.fontSize =
        (12 + Math.random() * 25) + "px";

    heart.style.animationDuration =
        (5 + Math.random() * 7) + "s";

    document
        .getElementById("loveScreen")
        .appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 12000);
}


function startFloatingHearts() {

    setInterval(() => {

        createFloatingHeart();

    }, 350);

}




window.addEventListener("resize", () => {

    const heart =
        document.querySelector(".heart-container");

    if (heart) {

        /*
          Keep the layout responsive.
          Existing heart text is left untouched.
        */

    }

});

</script>

</body>
</html>
