<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Just For You ❤️</title>

<style>


* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    min-height: 100vh;
    overflow: hidden;

    font-family: "Georgia", serif;

    background: #050008;

    color: white;
}


.login-screen {

    position: fixed;

    inset: 0;

    display: flex;

    justify-content: center;
    align-items: center;

    background:
        radial-gradient(
            circle at center,
            #3b071d 0%,
            #12000b 45%,
            #030003 100%
        );

    z-index: 100;

    transition:
        opacity 1.5s ease,
        transform 1.5s ease;
}


.login-screen.hide {

    opacity: 0;

    pointer-events: none;

    transform: scale(1.2);
}


.login-box {

    position: relative;

    width: min(90%, 400px);

    padding: 45px 35px;

    text-align: center;

    border-radius: 25px;

    background:
        rgba(255,255,255,0.06);

    border:
        1px solid rgba(255,150,180,0.25);

    backdrop-filter:
        blur(15px);

    box-shadow:
        0 0 40px rgba(255,20,100,0.15),
        inset 0 0 30px rgba(255,255,255,0.03);

    animation:
        appear 1.5s ease;
}


.login-heart {

    font-size: 45px;

    margin-bottom: 12px;

    filter:
        drop-shadow(0 0 10px #ff174f)
        drop-shadow(0 0 25px #ff174f);

    animation:
        heartbeat 1.5s infinite;
}


.login-box h1 {

    font-size: 35px;

    margin-bottom: 10px;

    color: #ff8fab;

    text-shadow:
        0 0 20px #ff477e;
}


.login-box p {

    color: #d9aab9;

    margin-bottom: 30px;

    font-size: 14px;

    line-height: 1.6;
}


.input-group {

    margin-bottom: 18px;
}


.input-group input {

    width: 100%;

    padding: 15px 18px;

    border:
        1px solid rgba(255,120,160,0.3);

    border-radius: 12px;

    outline: none;

    background:
        rgba(0,0,0,0.35);

    color: white;

    font-size: 15px;

    transition: .3s;
}


.input-group input::placeholder {

    color: #a97888;
}


.input-group input:focus {

    border-color: #ff6b96;

    box-shadow:
        0 0 15px rgba(255,60,120,.25);
}


.continue-btn {

    position: relative;

    overflow: hidden;

    width: 100%;

    padding: 15px;

    margin-top: 10px;

    border: none;

    border-radius: 12px;

    background:
        linear-gradient(
            135deg,
            #ff477e,
            #ff174f
        );

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    transition: .3s;

    box-shadow:
        0 0 20px rgba(255,30,90,.3);
}


.continue-btn:hover {

    transform:
        translateY(-3px);

    box-shadow:
        0 0 35px rgba(255,30,90,.6);
}


.continue-btn:active {

    transform:
        scale(.97);
}


.error {

    color: #ff6688;

    font-size: 13px;

    margin-top: 15px;

    min-height: 18px;
}



.love-screen {

    position: fixed;

    inset: 0;

    display: flex;

    justify-content: center;
    align-items: center;

    background:
        radial-gradient(
            circle at center,
            #4a061e 0%,
            #18000c 40%,
            #040004 100%
        );

    opacity: 0;

    pointer-events: none;

    transition:
        opacity 1.5s ease;

    overflow: hidden;
}


.love-screen.show {

    opacity: 1;

    pointer-events: auto;
}


.love-screen::before {

    content: "";

    position: absolute;

    width: 600px;
    height: 600px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255,20,100,.15),
            transparent 70%
        );

    filter: blur(15px);

    animation:
        backgroundGlow 4s ease-in-out infinite alternate;
}



.heart-container {

    position: absolute;

    width:
        min(90vw, 900px);

    height:
        min(80vh, 700px);

    display: flex;

    justify-content: center;
    align-items: center;

    animation:
        heartFloat 5s ease-in-out infinite;
}



.heart-text {

    position: absolute;

    color: #ff5c91;

    font-family: Arial, sans-serif;

    font-weight: bold;

    text-shadow:
        0 0 5px #ff174f,
        0 0 15px #ff174f,
        0 0 30px rgba(255,40,100,.8);

    white-space: nowrap;

    user-select: none;

    opacity: 0;

    animation:
        heartAppear 1.8s ease forwards,
        heartGlow 2s infinite alternate;
}


@keyframes heartAppear {

    0% {

        opacity: 0;

        transform:
            translate(-50%, -50%)
            scale(0);

        filter:
            blur(8px);
    }

    70% {

        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1.2);

        filter:
            blur(0);
    }

    100% {

        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1);
    }
}


@keyframes heartGlow {

    from {

        opacity: .55;
    }

    to {

        opacity: 1;
    }
}


@keyframes heartFloat {

    0%, 100% {

        transform:
            translateY(0);
    }

    50% {

        transform:
            translateY(-8px);
    }
}


.love-message {

    position: absolute;

    z-index: 20;

    text-align: center;

    pointer-events: none;

    animation:
        messageAppear 3s ease forwards;
}


.small-message {

    color: #ffc0d2;

    font-family: Arial, sans-serif;

    font-size: 12px;

    letter-spacing: 5px;

    text-transform: uppercase;

    margin-bottom: 8px;
}


.main-message {

    color: white;

    font-size:
        clamp(35px, 7vw, 75px);

    font-weight: bold;

    text-shadow:
        0 0 10px #ff477e,
        0 0 25px #ff174f,
        0 0 55px #ff174f;
}


.sub-message {

    margin-top: 12px;

    color: #ffc6d7;

    font-family: Arial, sans-serif;

    font-size: 14px;

    letter-spacing: 1px;
}


@keyframes messageAppear {

    0% {

        opacity: 0;

        transform:
            scale(.5);

        filter:
            blur(15px);
    }

    60% {

        opacity: 1;

        transform:
            scale(1.08);

        filter:
            blur(0);
    }

    100% {

        opacity: 1;

        transform:
            scale(1);
    }
}


.floating-heart {

    position: absolute;

    bottom: -30px;

    color: #ff477e;

    font-size: 18px;

    opacity: 0;

    animation:
        floatUp linear forwards;

    pointer-events: none;

    filter:
        drop-shadow(0 0 7px #ff174f);
}


@keyframes floatUp {

    0% {

        transform:
            translateY(0)
            scale(.5)
            rotate(0deg);

        opacity: 0;
    }

    15% {

        opacity: .8;
    }

    100% {

        transform:
            translateY(-110vh)
            scale(1.3)
            rotate(360deg);

        opacity: 0;
    }
}


.star {

    position: absolute;

    width: 3px;

    height: 3px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 8px white,
        0 0 15px #ff8eb0;

    pointer-events: none;

    animation:
        shootingStar 2s linear forwards;
}


@keyframes shootingStar {

    0% {

        transform:
            translate(0,0);

        opacity: 0;
    }

    15% {

        opacity: 1;
    }

    100% {

        transform:
            translate(-400px,400px);

        opacity: 0;
    }
}



.music-btn {

    display: none;

    position: fixed;

    left: 25px;

    bottom: 25px;

    z-index: 50;

    padding:
        11px 17px;

    border-radius: 50px;

    border:
        1px solid rgba(255,150,180,.25);

    background:
        rgba(255,255,255,.07);

    color: #ffd2df;

    backdrop-filter:
        blur(10px);

    cursor: pointer;

    transition: .3s;
}


.music-btn:hover {

    background:
        rgba(255,70,120,.18);

    transform:
        translateY(-2px);
}




.secret-btn {

    position: fixed;

    right: 25px;

    bottom: 25px;

    z-index: 50;

    padding:
        13px 20px;

    border-radius: 50px;

    color: white;

    background:
        linear-gradient(
            135deg,
            rgba(255,70,120,.75),
            rgba(170,10,70,.75)
        );

    border:
        1px solid rgba(255,180,200,.3);

    box-shadow:
        0 0 20px rgba(255,40,100,.25);

    cursor: pointer;

    font-family: Arial, sans-serif;

    animation:
        secretPulse 2s infinite;

    transition: .3s;
}


.secret-btn:hover {

    transform:
        translateY(-3px)
        scale(1.03);

    box-shadow:
        0 0 35px rgba(255,40,100,.55);
}


@keyframes secretPulse {

    0%,100% {

        box-shadow:
            0 0 15px
            rgba(255,40,100,.25);
    }

    50% {

        box-shadow:
            0 0 30px
            rgba(255,40,100,.55);
    }
}



.letter-screen {

    position: fixed;

    inset: 0;

    z-index: 200;

    display: flex;

    justify-content: center;
    align-items: center;

    background:
        rgba(5,0,5,.8);

    backdrop-filter:
        blur(12px);

    opacity: 0;

    pointer-events: none;

    transition:
        .8s ease;
}


.letter-screen.show {

    opacity: 1;

    pointer-events: auto;
}


.letter {

    position: relative;

    width:
        min(90%, 560px);

    max-height: 85vh;

    overflow-y: auto;

    padding:
        45px 35px;

    border-radius: 25px;

    background:
        linear-gradient(
            145deg,
            #fff8fa,
            #ffe9ef
        );

    color: #601329;

    box-shadow:
        0 0 80px rgba(255,40,100,.4);

    transform:
        translateY(60px)
        scale(.8)
        rotateX(20deg);

    transition:
        transform 1s
        cubic-bezier(.2,.8,.2,1);
}


.letter-screen.show .letter {

    transform:
        translateY(0)
        scale(1)
        rotateX(0);
}


.letter-heart {

    text-align: center;

    font-size: 38px;

    margin-bottom: 18px;

    animation:
        heartbeat 1.5s infinite;
}


.letter h2 {

    text-align: center;

    font-size: 30px;

    color: #a7194f;

    margin-bottom: 22px;
}


.letter-text {

    font-family:
        Georgia, serif;

    font-size: 16px;

    line-height: 1.9;

    color: #6d2941;

    min-height: 180px;
}


.letter-sign {

    margin-top: 20px;

    text-align: right;

    font-style: italic;

    color: #a7194f;
}


.close-letter {

    display: block;

    margin:
        25px auto 0;

    padding:
        10px 20px;

    border: none;

    border-radius: 30px;

    background: #b51c55;

    color: white;

    cursor: pointer;

    transition: .3s;
}


.close-letter:hover {

    transform:
        scale(1.05);
}


.unlock-particle {

    position: fixed;

    z-index: 200;

    pointer-events: none;

    color: #ff5a8a;

    text-shadow:
        0 0 15px #ff174f;
}


@keyframes appear {

    from {

        opacity: 0;

        transform:
            translateY(30px);
    }

    to {

        opacity: 1;

        transform:
            translateY(0);
    }
}


@keyframes heartbeat {

    0%,100% {

        transform:
            scale(1);
    }

    15% {

        transform:
            scale(1.18);
    }

    30% {

        transform:
            scale(1);
    }

    45% {

        transform:
            scale(1.12);
    }
}


@keyframes backgroundGlow {

    from {

        opacity: .5;

        transform:
            scale(.9);
    }

    to {

        opacity: 1;

        transform:
            scale(1.15);
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    .login-box {

        padding:
            35px 25px;
    }

    .login-box h1 {

        font-size: 28px;
    }

    .login-heart {

        font-size: 38px;
    }

    .heart-text {

        font-size:
            8px !important;
    }

    .small-message {

        font-size: 9px;

        letter-spacing: 3px;
    }

    .sub-message {

        font-size: 12px;
    }

    .music-btn {

        left: 15px;

        bottom: 15px;

        font-size: 12px;
    }

    .secret-btn {

        right: 15px;

        bottom: 15px;

        font-size: 12px;

        padding:
            11px 15px;
    }

    .letter {

        padding:
            35px 25px;
    }

    .letter h2 {

        font-size: 25px;
    }

    .letter-text {

        font-size: 15px;
    }
}

</style>
</head>


<body>



<div
    class="login-screen"
    id="loginScreen"
>

    <div class="login-box">

        <div class="login-heart">
            ❤️
        </div>

        <h1>
            For Someone Special
        </h1>

        <p>
            Some little things are meant to be discovered.
            <br>
            Maybe this one is for you.
        </p>


        <div class="input-group">

            <input
                type="text"
                id="username"
                placeholder="Username"
                autocomplete="off"
            >

        </div>


        <div class="input-group">

            <input
                type="password"
                id="password"
                placeholder="Password"
            >

        </div>


        <button
            class="continue-btn"
            id="continueBtn"
            onclick="login()"
        >
            Continue ❤️
        </button>


        <div
            class="error"
            id="error"
        ></div>

    </div>

</div>




<div
    class="love-screen"
    id="loveScreen"
>


    <div
        class="heart-container"
        id="heartContainer"
    >
        <!-- Heart generated by JavaScript -->
    </div>


    <div class="love-message">

        <div class="small-message">
            This is for you
        </div>

        <div class="main-message">
            I Love You ❤️
        </div>

        <div class="sub-message">
            Today, tomorrow, and every day.
        </div>

    </div>


    <!-- Fallback music button -->
    <button
        class="music-btn"
        id="musicBtn"
    >
        🎵 Play
    </button>


    <!-- Secret letter -->
    <button
        class="secret-btn"
        id="secretBtn"
        onclick="openLetter()"
    >
        There is one more thing... 💌
    </button>

</div>





<div
    class="letter-screen"
    id="letterScreen"
>

    <div class="letter">

        <div class="letter-heart">
            💌
        </div>


        <h2>
            For You
        </h2>


        <div
            class="letter-text"
            id="letterText"
        ></div>


        <div class="letter-sign">
            With all my love,<br>
            Thiện Nhân ❤️
        </div>


        <button
            class="close-letter"
            onclick="closeLetter()"
        >
            Close ❤️
        </button>

    </div>

</div>





<audio
    id="loveMusic"
    loop
>


    <source
        src="music/Just The Two Of Us.mp3"
        type="audio/mpeg"
    >

</audio>



<script>




const CONFIG = {

    username: "LoveWithYou-3010",

    password: "30102012@#",

    letter:
        "No pen, no paper, but you still draw my attention. " +
        "I don't really know how to explain it. " +
        "There's just something about you that keeps catching my attention. " +
        "It's not only about your looks. " +
        "It's the way you talk, the things you say, the way you laugh, and even your little expressions. I love all of these things about you. " +
        "I love listening to you. I love your voice, and I love your beauty. " +
        "But what I love the most is your smile... " +
        "Your smile is like sunshine, bright enough to heal all the pain inside me. " +
        "With all my love, " +
        "Thiện Nhân"

};



function login() {

    const username =
        document
            .getElementById("username")
            .value
            .trim();


    const password =
        document
            .getElementById("password")
            .value;


    const error =
        document
            .getElementById("error");


    const button =
        document
            .getElementById("continueBtn");


    if (
        username === CONFIG.username &&
        password === CONFIG.password
    ) {


        error.textContent = "";


        button.textContent =
            "Unlocked ❤️";


        button.style.pointerEvents =
            "none";


        createUnlockParticles();


        const music =
            document
                .getElementById("loveMusic");


        music.volume = 0;


        music.play()

            .then(() => {

                let volume = 0;


                const fadeIn =
                    setInterval(() => {

                        volume += 0.03;


                        if (volume >= 1) {

                            volume = 1;

                            clearInterval(
                                fadeIn
                            );

                        }


                        music.volume =
                            volume;


                    }, 100);

            })

            .catch(() => {


                console.log(
                    "Autoplay bị trình duyệt chặn."
                );


                document
                    .getElementById("musicBtn")
                    .style.display =
                    "block";

            });


        setTimeout(() => {

            document
                .getElementById("loginScreen")
                .classList
                .add("hide");

        }, 400);


      

        setTimeout(() => {

            document
                .getElementById("loveScreen")
                .classList
                .add("show");


            createHeart();


            startFloatingHearts();


            startStars();

        }, 1200);


    } else {


        error.textContent =
            "The username or the password is incorrect ❤️";




        const box =
            document
                .querySelector(".login-box");


        box.animate(

            [
                {
                    transform:
                        "translateX(0)"
                },

                {
                    transform:
                        "translateX(-8px)"
                },

                {
                    transform:
                        "translateX(8px)"
                },

                {
                    transform:
                        "translateX(-5px)"
                },

                {
                    transform:
                        "translateX(5px)"
                },

                {
                    transform:
                        "translateX(0)"
                }

            ],

            {
                duration: 450
            }

        );

    }

}

document
    .getElementById("password")
    .addEventListener(
        "keydown",
        function(e) {

            if (e.key === "Enter") {

                login();

            }

        }
    );


function createHeart() {

    const container =
        document
            .getElementById("heartContainer");


    container.innerHTML = "";


    const heartWidth =
        Math.min(
            window.innerWidth * 0.42,
            400
        );


    const heartHeight =
        Math.min(
            window.innerHeight * 0.38,
            280
        );


    /*
       Giữ nguyên 650 chữ như code ban đầu
       trên desktop.
    */

    const count =
        window.innerWidth < 600
            ? 400
            : 650;


    for (
        let i = 0;
        i < count;
        i++
    ) {


        const t =
            Math.random()
            *
            Math.PI
            *
            2;


        const scale =
            Math.sqrt(
                Math.random()
            );


        /*
           CÔNG THỨC TRÁI TIM GỐC
        */

        let x =
            16 *
            Math.pow(
                Math.sin(t),
                3
            );


        let y =
            13 *
            Math.cos(t)
            -
            5 *
            Math.cos(2 * t)
            -
            2 *
            Math.cos(3 * t)
            -
            Math.cos(4 * t);


        x *= scale;

        y *= scale;


        const span =
            document
                .createElement("span");


        span.className =
            "heart-text";



        span.textContent =
            "I Love You";


        const fontSize =
            window.innerWidth < 600
                ? 8
                : 10;


        span.style.fontSize =
            fontSize
            +
            Math.random() * 3
            +
            "px";


        span.style.left =
            `calc(
                50% +
                ${(x / 16) * heartWidth / 2}px
            )`;


        span.style.top =
            `calc(
                50% -
                ${(y / 17) * heartHeight / 2}px
            )`;


        span.style.transform =
            "translate(-50%, -50%)";


        span.style.animationDelay =
            Math.random() * 2
            +
            "s";


        container.appendChild(
            span
        );

    }

}


function createFloatingHeart() {

    const heart =
        document
            .createElement("div");


    heart.className =
        "floating-heart";


    heart.textContent =
        Math.random() > .5
            ? "♥"
            : "♡";


    heart.style.left =
        Math.random() * 100
        +
        "vw";


    heart.style.fontSize =
        12
        +
        Math.random() * 25
        +
        "px";


    heart.style.animationDuration =
        5
        +
        Math.random() * 7
        +
        "s";


    document
        .getElementById("loveScreen")
        .appendChild(heart);


    setTimeout(
        () => heart.remove(),
        13000
    );

}


function startFloatingHearts() {

    setInterval(
        createFloatingHeart,
        350
    );

}



function createStar() {

    const star =
        document
            .createElement("div");


    star.className =
        "star";


    star.style.left =
        Math.random() * 100
        +
        "vw";


    star.style.top =
        Math.random() * 55
        +
        "vh";


    document
        .getElementById("loveScreen")
        .appendChild(star);


    setTimeout(
        () => star.remove(),
        2200
    );

}


function startStars() {

    setInterval(
        createStar,
        1700
    );

}


function createUnlockParticles() {

    const screen =
        document
            .getElementById("loginScreen");


    for (
        let i = 0;
        i < 35;
        i++
    ) {


        const particle =
            document
                .createElement("div");


        particle.className =
            "unlock-particle";


        particle.textContent =
            Math.random() > .5
                ? "♥"
                : "✦";


        particle.style.left =
            "50%";


        particle.style.top =
            "50%";


        particle.style.fontSize =
            10
            +
            Math.random() * 20
            +
            "px";


        const angle =
            Math.random()
            *
            Math.PI
            *
            2;


        const distance =
            100
            +
            Math.random() * 300;


        particle.animate(

            [

                {
                    transform:
                        "translate(-50%,-50%) scale(0)",

                    opacity: 0

                },

                {

                    transform:
                        "translate(-50%,-50%) scale(1)",

                    opacity: 1

                },

                {

                    transform:
                        `
                        translate(
                            calc(
                                -50% +
                                ${Math.cos(angle) * distance}px
                            ),
                            calc(
                                -50% +
                                ${Math.sin(angle) * distance}px
                            )
                        )
                        scale(0)
                        `,

                    opacity: 0

                }

            ],

            {

                duration:
                    900
                    +
                    Math.random() * 700,

                easing:
                    "cubic-bezier(.2,.8,.2,1)"

            }

        );


        screen.appendChild(
            particle
        );


        setTimeout(
            () => particle.remove(),
            1800
        );

    }

}




function openLetter() {

    const screen =
        document
            .getElementById("letterScreen");


    const text =
        document
            .getElementById("letterText");


    screen
        .classList
        .add("show");


    text.textContent =
        "";


    typeWriter(
        CONFIG.letter,
        text,
        25
    );

}


function closeLetter() {

    document
        .getElementById("letterScreen")
        .classList
        .remove("show");

}



function typeWriter(
    message,
    element,
    speed
) {

    let index = 0;


    function type() {

        if (
            index <
            message.length
        ) {


            element.textContent +=
                message.charAt(index);


            index++;


            setTimeout(
                type,
                speed
            );

        }

    }


    type();

}


document
    .getElementById("musicBtn")
    .addEventListener(
        "click",
        () => {


            const music =
                document
                    .getElementById("loveMusic");


            if (music.paused) {


                music.volume = 1;


                music.play()
                    .then(() => {

                        document
                            .getElementById("musicBtn")
                            .textContent =
                            "🔊 Playing...";

                    });


            } else {


                music.pause();


                document
                    .getElementById("musicBtn")
                    .textContent =
                    "🎵 Play our song";

            }

        }
    );


let resizeTimer;


window.addEventListener(
    "resize",
    () => {


        clearTimeout(
            resizeTimer
        );


        resizeTimer =
            setTimeout(
                () => {


                    const loveScreen =
                        document
                            .getElementById("loveScreen");


                    if (
                        loveScreen
                            .classList
                            .contains("show")
                    ) {

                        createHeart();

                    }

                },
                300
            );

    }
);

</script>
