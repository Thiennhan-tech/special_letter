<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Just For You ❤️</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    min-height: 100vh;
    overflow: hidden;
    font-family: Georgia, serif;
    background: #050008;
    color: white;
}



.login-screen {
    position: fixed;
    inset: 0;

    display: flex;
    justify-content: center;
    align-items: center;

    z-index: 100;

    background:
        radial-gradient(
            circle at center,
            #3b071d 0%,
            #12000b 45%,
            #030003 100%
        );

    transition:
        opacity 1.3s ease,
        transform 1.3s ease;
}

.login-screen.hide {
    opacity: 0;
    pointer-events: none;
    transform: scale(1.15);
}

.login-box {
    width: min(90%, 400px);

    padding: 42px 32px;

    text-align: center;

    border-radius: 25px;

    background:
        rgba(255,255,255,.06);

    border:
        1px solid rgba(255,150,180,.25);

    backdrop-filter: blur(15px);

    box-shadow:
        0 0 40px rgba(255,20,100,.15),
        inset 0 0 30px rgba(255,255,255,.03);

    animation: appear 1.5s ease;
}

.login-heart {
    font-size: 45px;
    margin-bottom: 12px;

    filter:
        drop-shadow(0 0 10px #ff174f)
        drop-shadow(0 0 25px #ff174f);

    animation: heartbeat 1.5s infinite;
}

.login-box h1 {
    font-size: 34px;
    margin-bottom: 10px;

    color: #ff8fab;

    text-shadow:
        0 0 20px #ff477e;
}

.login-box p {
    color: #d9aab9;

    margin-bottom: 28px;

    font-size: 14px;
    line-height: 1.6;
}

.input-group {
    margin-bottom: 16px;
}

.input-group input {
    width: 100%;

    padding: 15px 18px;

    border:
        1px solid rgba(255,120,160,.3);

    border-radius: 12px;

    outline: none;

    background:
        rgba(0,0,0,.35);

    color: white;

    font-size: 15px;

    transition: .3s;
}

.input-group input::placeholder {
    color: #a97888;
}

.input-group input:focus {
    border-color: #ff6b96;

    box-shadow:
        0 0 15px rgba(255,60,120,.25);
}

.continue-btn {
    width: 100%;

    padding: 15px;

    margin-top: 8px;

    border: none;
    border-radius: 12px;

    background:
        linear-gradient(
            135deg,
            #ff477e,
            #ff174f
        );

    color: white;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;

    transition: .3s;

    box-shadow:
        0 0 20px rgba(255,30,90,.3);
}

.continue-btn:hover {
    transform: translateY(-3px);

    box-shadow:
        0 0 35px rgba(255,30,90,.6);
}

.error {
    min-height: 18px;

    margin-top: 14px;

    color: #ff6688;

    font-size: 13px;
}



.love-screen {
    position: fixed;
    inset: 0;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;

    background:
        radial-gradient(
            circle at center,
            #4a061e 0%,
            #18000c 42%,
            #040004 100%
        );

    opacity: 0;
    pointer-events: none;

    transition:
        opacity 1.5s ease;
}

.love-screen.show {
    opacity: 1;
    pointer-events: auto;
}

.love-screen::before {
    content: "";

    position: absolute;

    width: 650px;
    height: 650px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255,20,100,.15),
            transparent 70%
        );

    filter: blur(20px);

    animation:
        backgroundGlow 4s ease-in-out infinite alternate;
}


.heart-container {
    position: absolute;

    width: min(90vw, 900px);
    height: min(80vh, 700px);

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    animation:
        heartFloat 5s ease-in-out infinite;
}

.heart-text {
    position: absolute;

    color: #ff5c91;

    font-family: Arial, sans-serif;

    font-weight: bold;

    white-space: nowrap;

    user-select: none;

    text-shadow:
        0 0 5px #ff174f,
        0 0 15px #ff174f,
        0 0 30px rgba(255,40,100,.8);

    opacity: 0;

    animation:
        heartAppear 1.8s ease forwards,
        heartGlow 2s infinite alternate;
}



.letter-card {
    position: absolute;

    z-index: 30;

    width: min(430px, 68vw);
    max-height: 55vh;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%)
        scale(.85);

    padding: 28px 30px;

    border-radius: 22px;

    background:
        linear-gradient(
            145deg,
            rgba(255,248,250,.96),
            rgba(255,232,240,.94)
        );

    color: #64152f;

    box-shadow:
        0 0 45px rgba(255,40,100,.35),
        inset 0 0 20px rgba(255,255,255,.6);

    backdrop-filter: blur(8px);

    opacity: 0;

    animation:
        letterAppear 2s 2.5s ease forwards;

    overflow-y: auto;
}

.letter-heart {
    text-align: center;

    font-size: 30px;

    margin-bottom: 8px;

    animation:
        heartbeat 1.5s infinite;
}

.letter-card h2 {
    text-align: center;

    color: #a7194f;

    font-size: 25px;

    margin-bottom: 15px;
}

.letter-text {
    color: #6d2941;

    font-size: 14px;

    line-height: 1.7;

    text-align: center;
}

.letter-sign {
    margin-top: 15px;

    text-align: right;

    color: #a7194f;

    font-style: italic;

    font-size: 14px;
}




.music-btn {
    display: none;

    position: fixed;

    left: 22px;
    bottom: 22px;

    z-index: 100;

    padding: 12px 18px;

    border-radius: 50px;

    border:
        1px solid rgba(255,150,180,.25);

    background:
        rgba(255,255,255,.08);

    color: #ffd2df;

    backdrop-filter: blur(10px);

    cursor: pointer;

    box-shadow:
        0 0 20px rgba(255,40,100,.2);

    transition: .3s;
}

.music-btn:hover {
    transform: translateY(-3px);

    background:
        rgba(255,70,120,.2);
}



.floating-heart {
    position: absolute;

    bottom: -30px;

    color: #ff477e;

    opacity: 0;

    pointer-events: none;

    filter:
        drop-shadow(0 0 7px #ff174f);

    animation:
        floatUp linear forwards;
}

@keyframes floatUp {

    0% {
        transform:
            translateY(0)
            scale(.5)
            rotate(0);

        opacity: 0;
    }

    15% {
        opacity: .8;
    }

    100% {
        transform:
            translateY(-110vh)
            scale(1.3)
            rotate(360deg);

        opacity: 0;
    }
}




.star {
    position: absolute;

    width: 3px;
    height: 3px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 8px white,
        0 0 15px #ff8eb0;

    animation:
        shootingStar 2s linear forwards;

    pointer-events: none;
}

@keyframes shootingStar {

    0% {
        transform:
            translate(0,0);

        opacity: 0;
    }

    15% {
        opacity: 1;
    }

    100% {
        transform:
            translate(-400px,400px);

        opacity: 0;
    }
}

@keyframes heartAppear {

    0% {
        opacity: 0;

        transform:
            translate(-50%, -50%)
            scale(0);

        filter: blur(8px);
    }

    70% {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1.2);

        filter: blur(0);
    }

    100% {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1);
    }
}

@keyframes heartGlow {

    from {
        opacity: .55;
    }

    to {
        opacity: 1;
    }
}

@keyframes heartFloat {

    0%,100% {
        margin-top: 0;
    }

    50% {
        margin-top: -8px;
    }
}

@keyframes letterAppear {

    0% {
        opacity: 0;

        transform:
            translate(-50%, -50%)
            scale(.65);

        filter: blur(10px);
    }

    70% {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1.04);

        filter: blur(0);
    }

    100% {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1);
    }
}

@keyframes heartbeat {

    0%,100% {
        transform: scale(1);
    }

    15% {
        transform: scale(1.18);
    }

    30% {
        transform: scale(1);
    }

    45% {
        transform: scale(1.12);
    }
}

@keyframes backgroundGlow {

    from {
        opacity: .5;
        transform: scale(.9);
    }

    to {
        opacity: 1;
        transform: scale(1.15);
    }
}

@keyframes appear {

    from {
        opacity: 0;
        transform: translateY(30px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}




@media (max-width: 600px) {

    .login-box {
        padding: 35px 25px;
    }

    .login-box h1 {
        font-size: 28px;
    }

    .login-heart {
        font-size: 38px;
    }

    .heart-text {
        font-size: 7px !important;
    }

    .letter-card {
        width: 70vw;
        max-height: 48vh;

        padding:
            20px 18px;
    }

    .letter-heart {
        font-size: 24px;
    }

    .letter-card h2 {
        font-size: 21px;
    }

    .letter-text {
        font-size: 11px;
        line-height: 1.6;
    }

    .letter-sign {
        font-size: 11px;
    }

    .music-btn {
        left: 15px;
        bottom: 15px;
        font-size: 12px;
    }
}

</style>
</head>


<body>




<div
    class="login-screen"
    id="loginScreen"
>

    <div class="login-box">

        <div class="login-heart">
            ❤️
        </div>

        <h1>
            For Someone Special
        </h1>

        <p>
            Some little things are meant to be discovered.
            <br>
            Maybe this one is for you.
        </p>

        <div class="input-group">

            <input
                type="text"
                id="username"
                placeholder="Username"
                autocomplete="off"
            >

        </div>

        <div class="input-group">

            <input
                type="password"
                id="password"
                placeholder="Password"
            >

        </div>

        <button
            class="continue-btn"
            id="continueBtn"
            onclick="login()"
        >
            Continue ❤️
        </button>

        <div
            class="error"
            id="error"
        ></div>

    </div>

</div>




<div
    class="love-screen"
    id="loveScreen"
>

    <div
        class="heart-container"
        id="heartContainer"
    ></div>



    <div class="letter-card">

        <div class="letter-heart">
            💌
        </div>

        <h2>
            For You
        </h2>

        <div
            class="letter-text"
            id="letterText"
        ></div>

        <div class="letter-sign">
            With all my love,<br>
            Thiện Nhân ❤️
        </div>

    </div>


    <button
        class="music-btn"
        id="musicBtn"
    >
        🎵 Play our song
    </button>

</div>



<audio
    id="loveMusic"
    loop
    preload="auto"
>

    <source
        src="./music/love-song.mp3"
        type="audio/mpeg"
    >

</audio>


<script>



const CONFIG = {

    username: "LoveWithYou-3010",

    password: "30102012@#",

    letter:
        "No pen, no paper, but you still draw my attention. " +
        "I don't really know how to explain it. " +
        "There's just something about you that keeps catching my attention. " +
        "It's not only about your looks. " +
        "It's the way you talk, the things you say, the way you laugh, and even your little expressions. I love all of these things about you. " +
        "I love listening to you. I love your voice, and I love your beauty. " +
        "But what I love the most is your smile... " +
        "Your smile is like sunshine, bright enough to heal all the pain inside me. " +
        "With all my love, " +
        "Thiện Nhân"

};



function login() {

    const username =
        document
            .getElementById("username")
            .value
            .trim();

    const password =
        document
            .getElementById("password")
            .value;

    const error =
        document
            .getElementById("error");

    const button =
        document
            .getElementById("continueBtn");


    if (
        username === CONFIG.username &&
        password === CONFIG.password
    ) {

        error.textContent = "";

        button.textContent =
            "Unlocked ❤️";

        button.style.pointerEvents =
            "none";


        createHeart();


        document
            .getElementById("loginScreen")
            .classList
            .add("hide");


        setTimeout(() => {

            document
                .getElementById("loveScreen")
                .classList
                .add("show");


            startFloatingHearts();

            startStars();

            startLetter();

            startMusic();

        }, 900);


    } else {

        error.textContent =
            "The username or the password is incorrect ❤️";


        const box =
            document
                .querySelector(".login-box");


        box.animate(
            [
                { transform: "translateX(0)" },
                { transform: "translateX(-8px)" },
                { transform: "translateX(8px)" },
                { transform: "translateX(-5px)" },
                { transform: "translateX(5px)" },
                { transform: "translateX(0)" }
            ],
            {
                duration: 450
            }
        );

    }

}




document
    .getElementById("password")
    .addEventListener(
        "keydown",
        function(e) {

            if (e.key === "Enter") {
                login();
            }

        }
    );



function createHeart() {

    const container =
        document
            .getElementById("heartContainer");

    container.innerHTML = "";


    const heartWidth =
        Math.min(
            window.innerWidth * 0.42,
            400
        );

    const heartHeight =
        Math.min(
            window.innerHeight * 0.38,
            280
        );


    const count =
        window.innerWidth < 600
            ? 400
            : 650;


    for (
        let i = 0;
        i < count;
        i++
    ) {

        const t =
            Math.random()
            * Math.PI
            * 2;


        const scale =
            Math.sqrt(
                Math.random()
            );


        let x =
            16 *
            Math.pow(
                Math.sin(t),
                3
            );


        let y =
            13 *
            Math.cos(t)
            -
            5 *
            Math.cos(2 * t)
            -
            2 *
            Math.cos(3 * t)
            -
            Math.cos(4 * t);


        x *= scale;
        y *= scale;


        const span =
            document.createElement("span");


        span.className =
            "heart-text";


        span.textContent =
            "I Love You";


        const fontSize =
            window.innerWidth < 600
                ? 7
                : 10;


        span.style.fontSize =
            fontSize +
            Math.random() * 3 +
            "px";


        span.style.left =
            `calc(
                50% +
                ${(x / 16) * heartWidth / 2}px
            )`;


        span.style.top =
            `calc(
                50% -
                ${(y / 17) * heartHeight / 2}px
            )`;


        span.style.transform =
            "translate(-50%, -50%)";


        span.style.animationDelay =
            Math.random() * 2 +
            "s";


        container.appendChild(span);

    }

}


function startLetter() {

    const element =
        document
            .getElementById("letterText");


    element.textContent = "";


    typeWriter(
        CONFIG.letter,
        element,
        22
    );

}


function typeWriter(
    text,
    element,
    speed
) {

    let index = 0;


    function type() {

        if (
            index <
            text.length
        ) {

            element.textContent +=
                text.charAt(index);

            index++;

            setTimeout(
                type,
                speed
            );

        }

    }


    type();

}


function startMusic() {

    const music =
        document
            .getElementById("loveMusic");

    const button =
        document
            .getElementById("musicBtn");


    music.volume = 0;


    music.play()
        .then(() => {

            console.log(
                "🎵 Music started!"
            );


            button.style.display =
                "none";


            let volume = 0;


            const fadeIn =
                setInterval(() => {

                    volume += 0.03;


                    if (volume >= 1) {

                        volume = 1;

                        clearInterval(
                            fadeIn
                        );

                    }


                    music.volume =
                        volume;


                }, 100);

        })
        .catch((error) => {

            console.log(
                "Autoplay bị chặn:",
                error
            );


            button.style.display =
                "block";


            button.textContent =
                "🎵 Play our song";

        });

}


/* MUSIC BUTTON */

document
    .getElementById("musicBtn")
    .addEventListener(
        "click",
        () => {

            const music =
                document
                    .getElementById("loveMusic");


            music.volume = 1;


            music.play()
                .then(() => {

                    document
                        .getElementById("musicBtn")
                        .textContent =
                        "🔊 Playing...";


                    setTimeout(() => {

                        document
                            .getElementById("musicBtn")
                            .style.display =
                            "none";

                    }, 1200);

                });

        }
    );


function createFloatingHeart() {

    const heart =
        document.createElement("div");


    heart.className =
        "floating-heart";


    heart.textContent =
        Math.random() > .5
            ? "♥"
            : "♡";


    heart.style.left =
        Math.random() * 100 +
        "vw";


    heart.style.fontSize =
        12 +
        Math.random() * 25 +
        "px";


    heart.style.animationDuration =
        5 +
        Math.random() * 7 +
        "s";


    document
        .getElementById("loveScreen")
        .appendChild(heart);


    setTimeout(
        () => heart.remove(),
        13000
    );

}


function startFloatingHearts() {

    setInterval(
        createFloatingHeart,
        350
    );

}




function createStar() {

    const star =
        document.createElement("div");


    star.className =
        "star";


    star.style.left =
        Math.random() * 100 +
        "vw";


    star.style.top =
        Math.random() * 55 +
        "vh";


    document
        .getElementById("loveScreen")
        .appendChild(star);


    setTimeout(
        () => star.remove(),
        2200
    );

}


function startStars() {

    setInterval(
        createStar,
        1700
    );

}


let resizeTimer;

window.addEventListener(
    "resize",
    () => {

        clearTimeout(
            resizeTimer
        );


        resizeTimer =
            setTimeout(
                () => {

                    createHeart();

                },
                300
            );

    }
);

</script>

</body>
</html>
